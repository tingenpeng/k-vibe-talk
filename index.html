<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FAF7F2" />
  <title>K-Vibe Talk｜首爾極簡實戰韓語</title>
  <link rel="manifest" href="manifest.json" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FAF7F2',
            oat: '#F0EAE1',
            espresso: '#231F20',
            point: '#C85A50',
            pointLight: '#FDF0ED',
            pointDark: '#A8433A'
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', '"Noto Sans KR"', 'sans-serif'],
            kr: ['"Noto Sans KR"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #FAF7F2; color: #231F20; }
    .slot-pill { transition: all 0.15s ease-out; }
    .slot-pill:active { transform: scale(0.95); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans pb-16">

  <!-- 極簡頂部：場景大選單 -->
  <header class="sticky top-0 z-30 bg-cream/95 backdrop-blur border-b border-stone-200/80 px-4 py-3">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="w-8 h-8 rounded-xl bg-point text-white font-kr font-bold flex items-center justify-center text-sm">한</span>
        <h1 class="font-bold text-base tracking-tight">K-Vibe 極簡實戰</h1>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="toggleSpeed()" id="speedBtn" class="px-2.5 py-1 rounded-xl bg-white border border-stone-200 text-xs font-semibold text-espresso shadow-sm">
          🎧 正常速 1.0x
        </button>
      </div>
    </div>

    <!-- 一級大場景分頁 -->
    <div class="max-w-xl mx-auto mt-2.5 grid grid-cols-4 gap-1 text-center" id="mainSceneTabs">
      <button onclick="switchScene('bbq')" id="scene-bbq" class="scene-tab py-2 rounded-xl text-xs font-bold bg-espresso text-white shadow-sm transition">
        🥩 烤肉烤腸
      </button>
      <button onclick="switchScene('soup')" id="scene-soup" class="scene-tab py-2 rounded-xl text-xs font-bold bg-white text-stone-600 border border-stone-200 transition">
        🍲 湯飯燉鍋
      </button>
      <button onclick="switchScene('cafe')" id="scene-cafe" class="scene-tab py-2 rounded-xl text-xs font-bold bg-white text-stone-600 border border-stone-200 transition">
        ☕ 咖啡甜點
      </button>
      <button onclick="switchScene('clinic')" id="scene-clinic" class="scene-tab py-2 rounded-xl text-xs font-bold bg-white text-stone-600 border border-stone-200 transition">
        💉 醫美診所
      </button>
    </div>

    <!-- 額外場景（服飾/藥局/逛街）下拉或第二行 -->
    <div class="max-w-xl mx-auto mt-1.5 grid grid-cols-3 gap-1 text-center">
      <button onclick="switchScene('shopping')" id="scene-shopping" class="scene-tab py-1.5 rounded-xl text-xs font-bold bg-white text-stone-600 border border-stone-200 transition">
        👗 漢南洞買衣服鞋子
      </button>
      <button onclick="switchScene('pharmacy')" id="scene-pharmacy" class="scene-tab py-1.5 rounded-xl text-xs font-bold bg-white text-stone-600 border border-stone-200 transition">
        💊 藥局採買急救
      </button>
      <button onclick="switchScene('daily')" id="scene-daily" class="scene-tab py-1.5 rounded-xl text-xs font-bold bg-white text-stone-600 border border-stone-200 transition">
        🚕 計程車與退稅
      </button>
    </div>
  </header>

  <!-- 主舞台：一眼看懂的【萬用抽換式造句機】 -->
  <main class="flex-1 max-w-xl w-full mx-auto px-4 pt-4 space-y-4">

    <!-- 核心互動卡 -->
    <section class="bg-white rounded-3xl p-5 border border-stone-200/90 shadow-sm space-y-4">
      <div class="flex items-center justify-between border-b border-stone-100 pb-2">
        <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-pointLight text-point" id="sceneBadge">
          🥩 烤肉烤腸專用句
        </span>
        <span class="text-[11px] text-stone-400">點擊句子即可播放發音 🔊</span>
      </div>

      <!-- 句子主舞台（大字、極簡、填空區塊放大） -->
      <div onclick="playCurrentSentence()" class="cursor-pointer bg-pointLight/50 hover:bg-pointLight border-2 border-point/30 hover:border-point rounded-2xl p-4 transition group text-center space-y-2">
        <div class="font-kr font-extrabold text-2xl sm:text-3xl text-espresso tracking-tight leading-snug flex flex-wrap items-center justify-center gap-1.5">
          <span id="displayOpener" class="text-stone-700"></span>
          <span id="displaySlot" class="bg-white px-3 py-1 rounded-xl text-point border-2 border-point shadow-sm"></span>
          <span id="displayEnding" class="text-stone-900"></span>
        </div>
        <div class="text-xs font-kr font-semibold text-point" id="displayLiaison"></div>
        <p class="text-sm font-bold text-stone-600 pt-1" id="displayZh"></p>
      </div>

      <!-- 播放與功能按鈕 -->
      <div class="grid grid-cols-3 gap-2">
        <button onclick="playCurrentSentence(1.0)" class="py-2.5 rounded-xl bg-point hover:bg-pointDark text-white font-bold text-xs shadow-sm flex items-center justify-center gap-1">
          <span>🔊 聽發音</span>
        </button>
        <button onclick="playCurrentSentence(0.8)" class="py-2.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 font-semibold text-xs">
          🐢 慢速連音
        </button>
        <button onclick="openShowCard()" class="py-2.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-espresso font-semibold text-xs">
          🔍 放大給店員看
        </button>
      </div>

      <!-- 萬用句型主幹選擇（例如：點餐 2 人份 / 換烤盤 / 續小菜） -->
      <div class="pt-2 border-t border-stone-100">
        <span class="block text-xs font-bold text-stone-500 mb-2">1. 選擇你想做的事（切換句型骨架）：</span>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5" id="templateSelector">
          <!-- 由 app.js 動態渲染 -->
        </div>
      </div>

      <!-- 核心填空抽換詞（點哪顆，上面的空格就換成哪顆！） -->
      <div class="pt-2 border-t border-stone-100">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-point" id="slotSectionTitle">2. 點選你想抽換的品項/細節：</span>
        </div>
        <div class="flex flex-wrap gap-2" id="slotPillsContainer">
          <!-- 由 app.js 動態渲染按鈕 -->
        </div>
      </div>
    </section>

    <!-- 該場景專屬「店員連珠炮快嘴」一秒聽懂（精簡至最常被問的 1~2 句） -->
    <section class="bg-white rounded-3xl p-4 sm:p-5 border border-stone-200/90 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <span class="text-base">⚡</span>
          <h3 class="font-bold text-sm text-espresso" id="clerkTitle">店員會對你快速飆這句：</h3>
        </div>
        <button onclick="playClerkVoice()" class="px-2.5 py-1 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-xs">
          🔊 聽店員快嘴
        </button>
      </div>

      <div class="p-3 bg-stone-50 rounded-2xl border border-stone-200 space-y-1">
        <p class="font-kr font-bold text-base text-espresso" id="clerkKr"></p>
        <p class="text-xs font-bold text-stone-500" id="clerkZh"></p>
        <p class="text-[11px] text-amber-800 pt-1" id="clerkTip"></p>
      </div>

      <div class="pt-1">
        <span class="block text-xs font-bold text-stone-500 mb-1.5">👉 你可以一秒這樣回（不卑不亢）：</span>
        <div onclick="playReplyVoice()" class="cursor-pointer p-3 bg-pointLight/40 hover:bg-pointLight rounded-2xl border border-point/30 flex items-center justify-between gap-2">
          <div>
            <p class="font-kr font-bold text-sm sm:text-base text-espresso" id="replyKr"></p>
            <p class="text-xs text-stone-500 mt-0.5" id="replyZh"></p>
          </div>
          <span class="text-xs text-point font-bold shrink-0">🔊 點擊秒回</span>
        </div>
      </div>
    </section>

  </main>

  <!-- 放大給店員看的全螢幕大字彈窗 -->
  <div id="showCardModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 text-center space-y-4 relative">
      <button onclick="closeShowCard()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-stone-100 text-stone-600 font-bold flex items-center justify-center">✕</button>
      <span class="inline-block px-3 py-1 rounded-full bg-pointLight text-point text-xs font-bold">韓國現場出示卡</span>
      <div class="py-6 px-3 bg-cream rounded-2xl border-2 border-point">
        <p class="font-kr font-extrabold text-2xl sm:text-3xl text-espresso leading-snug" id="showModalKr"></p>
      </div>
      <p class="text-xs text-stone-500" id="showModalZh"></p>
      <button onclick="playCurrentSentence(0.95)" class="w-full py-3 rounded-2xl bg-point text-white font-bold text-sm shadow-md">
        🔊 播放發音
      </button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
