<html lang="zh-Hant">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>王小姐的日常自留清單｜Life捧烹</title>
  <meta name="description" content="王小姐的日常療癒所實際使用與無限回購清單。每一樣都是親自用過、吃過才推薦，並幫大家比對過目前最優惠的賣場價格。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF8F5;
      --card-bg: #FFFFFF;
      --text-main: #2C2825;
      --text-sub: #6E675F;
      --text-muted: #9C948B;
      --accent: #8C6D53;
      --accent-soft: #F2ECE4;
      --price-color: #B85D43;
      --border: #EAE4DC;
      --shadow: 0 4px 20px rgba(44, 40, 37, 0.04);
      --shadow-hover: 0 8px 28px rgba(44, 40, 37, 0.09);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.65;
      padding-bottom: 64px;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 16px;
    }
    /* Header / Profile */
    header {
      padding: 36px 0 22px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .avatar-wrap {
      width: 84px;
      height: 84px;
      margin: 0 auto 14px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #E5DDD3;
      background: #EFECE6;
    }
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .bio {
      font-size: 0.9rem;
      color: var(--text-sub);
      max-width: 520px;
      margin: 0 auto 18px;
      font-weight: 400;
    }
    /* Channel Links (Linktree Replacement) */
    .channel-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .channel-link {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: var(--text-main);
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 999px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .channel-link:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }
    /* Sticky Filter Bar */
    .sticky-nav {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(250, 248, 245, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 14px 0 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .search-row {
      margin-bottom: 10px;
    }
    .search-input {
      width: 100%;
      padding: 10px 16px;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #FFFFFF;
      color: var(--text-main);
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent);
    }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 2px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex-shrink: 0;
      padding: 7px 15px;
      font-size: 0.84rem;
      font-weight: 500;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--text-sub);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.18s ease;
    }
    .tab-btn.active {
      background: var(--text-main);
      color: #FFFFFF;
      border-color: var(--text-main);
    }
    /* App Notice Banner */
    .notice-bar {
      font-size: 0.78rem;
      color: var(--text-sub);
      background: var(--accent-soft);
      padding: 8px 14px;
      border-radius: 8px;
      margin-bottom: 18px;
      text-align: center;
    }
    /* Product Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (min-width: 680px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }
    .card-img-link {
      display: block;
      position: relative;
      width: 100%;
      padding-top: 100%;
      background: #F4F1EC;
      overflow: hidden;
      text-decoration: none;
    }
    .card-img-link img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }
    .card:hover .card-img-link img {
      transform: scale(1.03);
    }
    .badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(44, 40, 37, 0.82);
      color: #FFFFFF;
      font-size: 0.7rem;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }
    .card-body {
      padding: 12px 13px 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .cat-tag {
      font-size: 0.7rem;
      color: var(--accent);
      margin-bottom: 3px;
      font-weight: 500;
    }
    .card-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 0.93rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.42;
      margin-bottom: 7px;
      text-decoration: none;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-note {
      font-size: 0.8rem;
      color: var(--text-sub);
      line-height: 1.55; text-wrap: pretty;
      margin-bottom: 12px;
      flex: 1;
    }
    .card-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid #F2EFE9;
    }
    .price-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 9px;
      flex-wrap: wrap;
      gap: 4px;
    }
    .price {
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--price-color);
    }
    .price-note {
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    .btn-row {
      display: flex;
      gap: 6px;
    }
    .buy-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 10px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #FFFFFF;
      background: var(--text-main);
      border-radius: 7px;
      text-decoration: none;
      transition: background 0.2s;
      text-align: center;
    }
    .buy-btn:hover {
      background: var(--accent);
    }
    .article-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 9px;
      font-size: 0.76rem;
      color: var(--text-sub);
      background: var(--accent-soft);
      border-radius: 7px;
      text-decoration: none;
      white-space: nowrap;
    }
    .article-btn:hover {
      color: var(--text-main);
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
  </style>
</head>

    let currentCat = 'all';
    let currentQuery = '';

    const grid = document.getElementById('productGrid');
    const searchInput = document.getElementById('searchInput');
    const tabBtns = document.querySelectorAll('.tab-btn');

    function render() {
      const q = currentQuery.trim().toLowerCase();
      const filtered = PRODUCTS.filter(p => {
        const matchCat = currentCat === 'all' || p.category === currentCat;
        const matchQ = !q || p.name.toLowerCase().includes(q) || p.note.toLowerCase().includes(q) || p.categoryLabel.toLowerCase().includes(q);
        return matchCat && matchQ;
      });

      if (!filtered.length) {
        grid.innerHTML = '<div class="empty-state">找不到符合的選物，試試看其他關鍵字或切換分類。</div>';
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const btnLabel = p.link.includes('arlink') ? '前往官網' : '前往蝦皮App';
        const articleHtml = p.articleLink
          ? `<a class="article-btn" href="${p.articleLink}" target="_blank" rel="noopener">看實測文</a>`
          : '';
        return `
          <article class="card">
            <a class="card-img-link" href="${p.link}" target="_blank" rel="noopener">
              <img src="${p.image}" alt="${p.name}" loading="lazy">
              ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
            </a>
            <div class="card-body">
              <div class="cat-tag">${p.categoryLabel}｜${p.platform}</div>
              <a class="card-title" href="${p.link}" target="_blank" rel="noopener">${p.name}</a>
              <p class="card-note">${p.note}</p>
              <div class="card-footer">
                <div class="price-row">
                  <span class="price">$${p.price.toLocaleString()}</span>
                  <span class="price-note">${p.priceNote}</span>
                </div>
                <div class="btn-row">
                  ${articleHtml}
                  <a class="buy-btn" href="${p.link}" target="_blank" rel="noopener">${btnLabel}</a>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = btn.getAttribute('data-cat');
        render();
      });
    });

    searchInput.addEventListener('input', (e) => {
      currentQuery = e.target.value;
      render();
    });

    render();
  </script>
